<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היכל המוסיקה העיראקית - הקישורים הרשמיים</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #ffffff;
            --yt-red: #ff0000;
            --fb-blue: #1877f2;
            --show-purple: #a855f7;
            --business-gold: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at top, #1e293b 0%, #0b0f1a 100%);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        /* אזור הלוגו משודרג - גדול, צף ומקצועי */
        .header { 
            text-align: center; 
            margin-bottom: 40px; 
            animation: fadeInDown 0.8s ease-out;
        }
        .logo {
            width: 280px; /* מוגדל משמעותית */
            max-width: 90%;
            height: auto;
            object-fit: contain;
            /* הצללה כפולה: צל כהה לעומק + צל זהוב עדין להילה */
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 15px rgba(245, 158, 11, 0.2));
            transition: transform 0.3s ease;
        }
        .logo:hover {
            transform: scale(1.02);
        }

        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px; }
        
        /* כרטיסיות PRO מזכוכית (Glassmorphism) */
        .card {
            background: var(--card-bg); backdrop-filter: blur(10px); border-radius: 28px; padding: 25px;
            text-decoration: none; color: var(--text-color); border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 20px; transition: all 0.3s ease; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .card:hover { border-color: rgba(255, 255, 255, 0.2); background: rgba(30, 41, 59, 0.85); }
        .card:active { transform: scale(0.96); }
        .card-icon-box { width: 70px; height: 70px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; position: relative; }
        .card-info { flex: 1; }
        .card-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; display: block; }
        .card-desc { font-size: 1rem; color: #94a3b8; line-height: 1.3; }
        
        .yt-card { border-right: 6px solid var(--yt-red); }
        .yt-card .card-icon-box { background: rgba(255, 0, 0, 0.15); color: var(--yt-red); }
        .fb-card { border-right: 6px solid var(--fb-blue); }
        .fb-card .card-icon-box { background: rgba(24, 119, 242, 0.15); color: var(--fb-blue); }
        .show-card { border-right: 6px solid var(--show-purple); }
        .show-card .card-icon-box { background: rgba(168, 85, 247, 0.15); color: var(--show-purple); }
        .biz-card { border-right: 6px solid var(--business-gold); }
        .biz-card .card-icon-box { background: rgba(251, 191, 36, 0.15); color: var(--business-gold); }
        
        /* טופס פניות */
        .form-container {
            display: none; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border-radius: 24px; padding: 24px;
            border: 1px solid rgba(251, 191, 36, 0.3); margin-top: -10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
        }
        .form-container h3 { font-size: 1.2rem; color: var(--business-gold); margin-bottom: 15px; text-align: center; font-weight: 700; }
        .form-container input, .form-container textarea {
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a; color: #fff; font-size: 1rem; text-align: right; font-family: inherit; transition: border-color 0.2s;
        }
        .form-container input:focus, .form-container textarea:focus { outline: none; border-color: var(--business-gold); }
        .form-container textarea { height: 100px; resize: none; }
        .form-container button {
            width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000; font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3); transition: transform 0.2s;
        }
        .form-container button:active { transform: scale(0.98); }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <header class="header">
        <img src="logo.png" alt="היכל המוסיקה העיראקית" class="logo" onerror="this.style.display='none'">
    </header>

    <main class="container">
        <a href="https://www.youtube.com/@oldiraqisongs1" target="_blank" class="card yt-card">
            <div class="card-icon-box"><i class="fab fa-youtube"></i></div>
            <div class="card-info">
                <span class="card-title">ערוץ היוטיוב הרשמי</span>
                <span class="card-desc">כל השירים מבית אבא והחפלות בלחיצת כפתור</span>
            </div>
        </a>
        <a href="#" class="card fb-card">
            <div class="card-icon-box"><i class="fab fa-facebook-f"></i></div>
            <div class="card-info">
                <span class="card-title">קהילת הפייסבוק שלנו</span>
                <span class="card-desc">נפגשים, מעלים זכרונות ושומרים על קשר</span>
            </div>
        </a>
        <a href="#" class="card show-card">
            <div class="card-icon-box"><i class="fas fa-ticket-alt"></i></div>
            <div class="card-info">
                <span class="card-title">לוח חפלות ומופעים</span>
                <span class="card-desc">שריינו מקום במופע המרכזי - רכישת כרטיסים כאן</span>
            </div>
        </a>
        <div class="card biz-card" onclick="toggleForm()">
            <div class="card-icon-box"><i class="fas fa-envelope-open-text"></i></div>
            <div class="card-info">
                <span class="card-title">פרסום, סקירת עסקים ואירועים</span>
                <span class="card-desc">רוצים חשיפה מטורפת לעסק שלכם? הזמינו אותנו לסיקור!</span>
            </div>
        </div>
        <div class="form-container" id="bizForm">
            <h3>הזמנת סיקור / שיתוף פעולה עסקי</h3>
            <form action="https://formspree.io/f/xknkappy" method="POST">
                <input type="text" name="name" placeholder="שם מלא / שם העסק" required>
                <input type="tel" name="phone" placeholder="מספר טלפון לנייד" required>
                <input type="email" name="email" placeholder="כתובת אימייל ליצירת קשר" required>
                <textarea name="message" placeholder="ספרו לנו על העסק שלכם, ואיזה סוג סיקור/פרסום אתם מעוניינים לסגור..." required></textarea>
                <button type="submit">שלח בקשת סיקור</button>
            </form>
        </div>
    </main>

    <script>
        function toggleForm() {
            var form = document.getElementById('bizForm');
            if (form.style.display === 'block') {
                form.style.display = 'none';
            } else {
                form.style.display = 'block';
                form.scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
