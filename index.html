<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היכל המוסיקה העיראקית</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            text-align: center;
            margin: 30px 0 10px 0;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            border: 2px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .card:active {
            transform: scale(0.98);
        }
        .card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .card .title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .card .desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.4;
        }
        .youtube { border-color: #ff0000; }
        .facebook { border-color: #1877f2; }
        .shows { border-color: #8b5cf6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>היכל המוסיקה העיראקית</h1>
        </div>
        <div class="grid">
            <a href="https://www.youtube.com/@oldiraqisongs1" target="_blank" class="card youtube">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube">
                <div class="title">יוטיוב</div>
                <div class="desc">כל השירים מבית אבא וכל החפלות בלחיצת כפתור ביוטיוב</div>
            </a>

            <a href="#" class="card facebook">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook">
                <div class="title">פייסבוק</div>
                <div class="desc">הפייסבוק הרשמי של היכל המוסיקה העיראקית</div>
            </a>

            <a href="#" class="card shows">
                <img src="https://img.icons8.com/fluent/96/000000/ticket.png" alt="Shows">
                <div class="title">חפלות</div>
                <div class="desc">כל המופעים המופע המרכזי כרטיסים</div>
            </a>
        </div>
    </div>
</body>
</html>
