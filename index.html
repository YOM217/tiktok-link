<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היכל המוסיקה העיראקית</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #1e293b;
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            text-align: center;
            margin: 30px 0 10px 0;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            font-size: 1.5rem;
            font-weight: 700;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            border: 2px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .card:active {
            transform: scale(0.95);
        }
        .card span {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .youtube { border-color: #ff0000; }
        .facebook { border-color: #1877f2; }
        .shows { border-color: #8b5cf6; }
        .wikipedia { border-color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>היכל המוסיקה העיראקית</h1>
        </div>
        <div class="grid">
            <a href="https://www.youtube.com/@oldiraqisongs1" target="_blank" class="card youtube">
                <span>🔴</span>יוטיוב
            </a>
            <a href="#" class="card facebook">
                <span>🔵</span>פייסבוק
            </a>
            <a href="#" class="card shows">
                <span>🎬</span>מופעים
            </a>
            <a href="#" class="card wikipedia">
                <span>📝</span>ויקיפדיה
            </a>
        </div>
    </div>
</body>
</html>
