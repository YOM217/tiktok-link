<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היכל המוסיקה העיראקית - הקישורים הרשמיים</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #ffffff;
            --yt-red: #ff0000;
            --fb-blue: #1877f2;
            --show-purple: #a855f7;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at top, #1e293b 0%, #0b0f1a 100%);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* עיצוב הלוגו והכותרת */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .header .logo {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--gold);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* עיצוב הכרטיסים */
        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 25px;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card:active { transform: scale(0.96); }

        .card-icon-box {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            position: relative;
        }

        .card-info { flex: 1; }

        .card-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 4px;
            display: block;
        }

        .card-desc {
            font-size: 1rem;
            color: #94a3b8;
            line-height: 1.3;
        }

        /* עיצוב ספציפי לכל כפתור */
        .yt-card { border-right: 6px solid var(--yt-red); }
        .yt-card .card-icon-box { background: rgba(255, 0, 0, 0.15); color: var(--yt-red); }

        .fb-card { border-right: 6px solid var(--fb-blue); }
        .fb-card .card-icon-box { background: rgba(24, 119, 242, 0.15); color: var(--fb-blue); }

        .show-card { border-right: 6px solid var(--show-purple); }
        .show-card .card-icon-box { background: rgba(168, 85, 247, 0.15); color: var(--show-purple);
