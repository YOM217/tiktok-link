<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היכל המוסיקה העיראקית - הקישורים הרשמיים</title>
    
    <meta name="description" content="הערוץ הרשמי של היכל המוסיקה העיראקית - כל השירים מבית אבא, חפלות זכרונות וכרטיסים למופעים">
    <meta property="og:title" content="היכל המוסיקה העיראקית - הקישורים הרשמיים">
    <meta property="og:description" content="כל השירים מבית אבא, חפלות, זכרונות וכרטיסים למופעים">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            text-align: center;
            margin: 25px 0 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .header .logo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #f59e0b;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            border: 2px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 12px;
            z-index: 2;
        }
        .card .title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            z-index: 2;
        }
        .card .desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.4;
            z-index: 2;
        }
        .youtube { border-color: #ff0000; }
        .facebook { border-color: #1877f2; }
        .shows { border-color: #8b5cf6; }

        /* אלמנטים ויזואליים עליונים */
        .visual-element {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 24px;
            margin-bottom: 10px;
            z-index: 2;
        }

        /* 1. אפקט גלי מוזיקה ליוטיוב */
        .wave-bar {
            width: 4px;
            height: 5px;
            background-color: #ff0000;
            border-radius: 2px;
            margin: 0 2px;
            animation: bounce 0.8s ease-in-out infinite alternate;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.1s; }
        .wave-bar:nth-child(5) { animation-delay: 0.3s; }

        @keyframes bounce {
            100% { height: 24px; }
        }

        /* 2. אפקט פעימה לפייסבוק */
        .fb-pulse {
            width: 12px;
            height: 12px;
            background-color: #1877f2;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(24, 119, 242, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(24, 119, 242, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(24, 119, 242, 0); }
        }

        /* 3. אפקט כוכבים מנצנצים לחפלות */
        .sparkle {
            font-size: 1.2rem;
            animation: twinkle 1.2s infinite ease-in-out alternate;
        }
        .sparkle:nth-child(2) { animation-delay: 0.4s; margin: 0 8px; font-size: 1.4rem; }
        .sparkle:nth-child(3) { animation-delay: 0.8s; }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo.png" onerror="this.style.display='none'" class="logo" alt="לוגו היכל המוסיקה העיראקית">
            <h1>היכל המוסיקה העיראקית</h1>
        </div>
        <div class="grid">
            <a href="https://www.youtube.com/@oldiraqisongs1" target="_blank" class="card youtube">
                <div class="visual-element">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube">
                <div class="title">ערוץ היוטיוב הרשמי</div>
                <div class="desc">נוסטלגיה בלחיצת כפתור: כל השירים והחפלות מחכים לכם כאן</div>
            </a>

            <a href="#" class="card facebook">
                <div class="visual-element" style="align-items: center;">
                    <div class="fb-pulse"></div>
                </div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook">
                <div class="title">קהילת הפייסבוק שלנו</div>
                <div class="desc">נפגשים ומעלים זכרונות: כנסו לדף הרשמי ושמרו על קשר</div>
            </a>

            <a href="#" class="card shows">
                <div class="visual-element" style="align-items: center;">
                    <span class="sparkle">✨</span>
                    <span class="sparkle">⭐</span>
                    <span class="sparkle">✨</span>
                </div>
                <img src="https://img.icons8.com/fluent/96/000000/ticket.png" alt="Shows">
                <div class="title">לוח חפלות ומופעים</div>
                <div class="desc">החפלה הבאה מתחילה: לחצו לפרטים ורכישת כרטיסים למופע המרכזי</div>
            </a>
        </div>
    </div>
</body>
</html>
