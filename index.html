<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היכל המוסיקה העיראקית - הקישורים הרשמיים</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #ffffff;
            --yt-red: #ff0000;
            --fb-blue: #1877f2;
            --show-purple: #a855f7;
            --business-gold: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at top, #1e293b 0%, #0b0f1a 100%);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .header { text-align: center; margin-bottom: 40px; }
        .main-logo-medallion {
            display: flex; justify-content: center; align-items: center;
            width: 200px; height: 200px; margin: 0 auto 20px auto;
            background: radial-gradient(circle, #fcd34d 0%, #b45309 100%);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(251,191,36,0.5);
            border: 6px solid #b45309;
        }
        .main-logo-text {
            font-size: 1.8rem; font-weight: 900; text-align: center; line-height: 1.2;
            background: linear-gradient(to bottom, #ffffff, #fde047);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(10px); border-radius: 28px; padding: 25px;
            text-decoration: none; color: var(--text-color); border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 20px; transition: all 0.3s ease; cursor: pointer;
        }
        .card:active { transform: scale(0.96); }
        .card-icon-box { width: 70px; height: 70px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; position: relative; }
        .card-info { flex: 1; }
