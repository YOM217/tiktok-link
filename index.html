<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <style>
    /* --- הגדרות קודמות ... --- */

    /* --- עדכון קוד CSS מומלץ (לוגו בולט ויוקרתי) --- */
    .main-logo-medallion {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 250px; /* גדול פי 4 מבעבר כדי להיות בולט ומושך */
      height: 250px;
      margin: 40px auto 20px auto; /* מרווח כדי להבליט */
      background: radial-gradient(circle, #fcd34d 0%, #b45309 100%); /* מדליית זהב מדורגת */
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(251,191,36,0.5); /* עומק */
      border: 8px solid #b45309; /* מסגרת זהב כהה */
    }

    .main-logo-text {
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(to top, #fff, #fbbf24); /* טקסט לבן-זהב מובלט */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }

    /* --- הסרת כותרת הטקסט המקורית כדי למנוע כפילות --- */
    .main-title-text {
      display: none;
    }

    /* --- שאר הגדרות הכרטיסים והפריסה נשמרות ... --- */
  </style>
</head>
<body>
  <div class="main-container">
    <div class="header">
      <div class="main-logo-medallion">
        <div class="main-logo-text">
          היכל המוסיקה<br> העיראקית
        </div>
      </div>
      <h1 class="main-title-text">היכל המוסיקה העיראקית</h1>
    </div>

    </div>
</body>
</html>
